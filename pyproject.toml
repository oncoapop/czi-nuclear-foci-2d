[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "czi-nuclear-foci"
version = "0.1.0"
description = "Config-driven ZEISS CZI nuclear foci and co-localisation analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "Pillow",
  "reportlab",
  "scipy",
  "scikit-image",
  # src/czi_foci/current_dataset_plots.py imports pyplot at module level, so
  # this is a hard runtime dependency and was simply missing.
  "matplotlib",
]

[project.optional-dependencies]
# Reader cross-validation. tests/test_czi_reader_offsets.py compares this
# package's CZI decoding against an independent implementation (aicspylibczi
# wraps Zeiss's libCZI). That comparison is what caught the data_offset bug, so
# without it the suite can go green having never checked a real pixel.
#
# Pinned to the version the analysis environment runs; see
# constraints-analysis.txt for the full exact set.
test = [
  "aicspylibczi==4.0.1",
]

# The analysis environment, pinned.
#
# A constraints file alone does NOT reproduce an environment: `-c` only bounds
# packages something else already selected for installation. Review found that
# `pip install -e '.[test]' -c constraints-analysis.txt` installed no matplotlib
# at all, because neither the base dependencies nor the test extra requested it,
# and a constraint on an unrequested package does nothing. This extra does the
# selecting; the constraints file bounds the transitive closure as well.
#
# Versions read from the installed distributions of the pinned interpreter
# (CPython 3.11.4) via importlib.metadata -- not inferred. Keep in step with
# constraints-analysis.txt; tests/test_environment_pins.py fails if they drift.
analysis = [
  "numpy==1.26.2",
  "scipy==1.13.1",
  "scikit-image==0.24.0",
  "pandas==2.1.4",
  "matplotlib==3.8.1",
  "Pillow==11.0.0",
  "reportlab==4.0.8",
  # czi_foci.run_config imports yaml lazily, so YAML configs work only with
  # this installed. The documented `czi-foci run --config configs/*.yaml`
  # workflow is a YAML one, so the analysis environment needs it.
  "PyYAML==6.0.3",
]

[project.scripts]
czi-foci = "czi_foci.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
